[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-gate-api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["faro-gate", "faro-api-objects", "fastapi==0.162.0", "uvicorn==0.54.0"]

[tool.setuptools]
packages = ["gate_api", "gate_api.endpoints"]
package-dir = {gate_api = "infer/src"}
