[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-utils"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["pyarrow==26.0.0", "backoff==2.2.1", "pydantic==2.14.2", "openai==3.42.1", "tiktoken==0.14.0"]

[tool.setuptools.packages.find]
include = ["utils*"]
