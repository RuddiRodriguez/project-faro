[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-library-api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["faro-library", "faro-api-objects", "fastapi==0.162.0", "uvicorn==0.54.0"]

[tool.setuptools]
packages = ["library_api", "library_api.endpoints"]
package-dir = {library_api = "infer/src"}
