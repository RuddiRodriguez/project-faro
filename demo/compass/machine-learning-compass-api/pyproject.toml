[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-compass-api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["faro-compass", "faro-api-objects", "fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1"]

[tool.setuptools]
packages = ["compass_api", "compass_api.endpoints", "compass_api.external_services"]
package-dir = {compass_api = "infer/src"}
