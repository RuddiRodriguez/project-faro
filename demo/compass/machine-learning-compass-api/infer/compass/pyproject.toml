[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-compass"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["pandas==3.1.0", "pyarrow==26.0.0", "pydantic==2.14.2", "faro-api-objects"]

[tool.setuptools.packages.find]
include = ["compass*"]
