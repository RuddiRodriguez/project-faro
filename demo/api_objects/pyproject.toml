[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-api-objects"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["pydantic==2.14.2", "faro-utils"]

[tool.setuptools]
packages = ["api_objects", "api_objects.faro", "api_objects.faro.compass", "api_objects.faro.compass.input", "api_objects.faro.compass.output", "api_objects.faro.gate", "api_objects.faro.gate.input", "api_objects.faro.gate.output", "api_objects.faro.thread", "api_objects.faro.thread.input", "api_objects.faro.thread.output", "api_objects.faro.scout", "api_objects.faro.scout.input", "api_objects.faro.scout.output", "api_objects.faro.signal", "api_objects.faro.signal.input", "api_objects.faro.signal.output", "api_objects.faro.guide", "api_objects.faro.guide.input", "api_objects.faro.guide.output", "api_objects.faro.bridge", "api_objects.faro.bridge.input", "api_objects.faro.bridge.output", "api_objects.faro.shield", "api_objects.faro.shield.input", "api_objects.faro.shield.output", "api_objects.faro.voice", "api_objects.faro.voice.input", "api_objects.faro.voice.output", "api_objects.faro.connector", "api_objects.faro.connector.input", "api_objects.faro.connector.output"]
package-dir = {api_objects = "."}
