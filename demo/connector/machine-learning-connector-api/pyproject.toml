[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-connector-api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["faro-connector", "faro-api-objects", "fastapi==0.162.0", "uvicorn==0.54.0"]

[tool.setuptools]
packages = ["connector_api", "connector_api.endpoints"]
package-dir = {connector_api = "infer/src"}
