[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-shield"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["faro-utils", "faro-bridge", "faro-api-objects", "pydantic==2.14.2"]

[tool.setuptools.packages.find]
include = ["shield*"]
