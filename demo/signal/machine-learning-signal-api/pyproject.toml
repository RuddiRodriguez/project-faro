[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-signal-api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["faro-signal", "faro-api-objects", "fastapi==0.162.0", "uvicorn==0.54.0", "python-dotenv==1.2.4"]

[tool.setuptools]
packages = ["signal_api", "signal_api.endpoints"]
package-dir = {signal_api = "infer/src"}
