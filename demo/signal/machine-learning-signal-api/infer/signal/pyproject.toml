[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-signal"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["pydantic==2.14.2", "faro-utils", "faro-api-objects"]

[tool.setuptools]
packages = ["faro_signal", "faro_signal.common_tools", "faro_signal.quality", "faro_signal.prompts"]
package-dir = {faro_signal = "signal"}
