[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-scout"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["pydantic==2.14.2", "faiss-cpu==1.15.1", "transformers==5.22.1", "torch==2.15.0", "rank-bm25==0.2.2"]

[tool.setuptools.packages.find]
include = ["scout*", "knowledge_search*", "retrieval_utils*"]
