[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-voice-api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["faro-voice", "faro-api-objects", "fastapi==0.162.0", "uvicorn==0.54.0", "python-dotenv==1.2.4"]

[tool.setuptools]
packages = ["voice_api", "voice_api.endpoints"]
package-dir = {voice_api = "infer/src"}
