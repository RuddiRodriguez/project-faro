name: Check Faro on Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/linux-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Install Faro
        run: python -m pip install -r requirements-linux.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Test dataframe reads across sectors
        run: python -m unittest discover -s tests -p test_sector_stress.py -v
